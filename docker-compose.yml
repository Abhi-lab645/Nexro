version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: nexro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexro_db
      POSTGRES_USER: nexro_admin
      POSTGRES_PASSWORD: nexro_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./nexro-backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./nexro-backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexro_admin -d nexro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI Demand AI Microservice
  ai-service:
    build:
      context: ./nexro-ai-service
      dockerfile: Dockerfile
    container_name: nexro-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_HOST=0.0.0.0
      - AI_PORT=8000

  # 3. Node.js Central Backend Gateway & Statutory Ledger
  backend:
    build:
      context: ./nexro-backend
      dockerfile: Dockerfile
    container_name: nexro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=nexro_db
      - PGUSER=nexro_admin
      - PGPASSWORD=nexro_secure_password_2026
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=nexro_production_secret_key_85_5_10

  # 4. Cooperative Society & Federation Admin Portal
  web-portal:
    build:
      context: ./nexro-web-portal
      dockerfile: Dockerfile
    container_name: nexro-web-portal
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
